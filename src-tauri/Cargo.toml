[package]
name = "resume-advisor"
version = "0.1.0"
description = "定制化求职方案生成器（本地优先）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "resume_advisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
